# The repository's check through the CI library nddev-ci: a pull request runs `just check`
# and `just test`, a push to dev `just verify`, on GitHub's runners (a public repository).
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@86d0117166c205c6b52c91e0f95c8deaf5a29137 # v0.6.59
    permissions:
      contents: read
    with:
      rust-version: 1.100.0
      rust-components: clippy,rustfmt
      tool-assets: .github/ci-tools.json
      setup: true
      fetch-depth: 0
      reports: target/nextest/ci/junit.xml
