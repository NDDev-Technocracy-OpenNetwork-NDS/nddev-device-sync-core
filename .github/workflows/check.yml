name: NDS checks

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  quality:
    permissions:
      contents: read
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@d89f22a1b66410466de98dead910d47cf4450c6a
    with:
      setup: true
      rust-version: '1.99.1'
      rust-components: rustfmt,clippy
      tool-assets: .github/native-tools.json
      timeout-minutes: 20
